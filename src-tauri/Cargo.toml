[package]
name = "cowworker"
version = "0.2.15"
edition = "2021"
description = "Your local job search workspace"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
cowworker-core = { path = "../backend" }
serde_json = "1"
tauri-plugin-opener = "2"
rfd = "0.15"
uuid = { version = "1", features = ["v4"] }
