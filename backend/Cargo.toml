[package]
name = "cowworker-core"
version = "0.2.15"
edition = "2021"

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
pdf-extract = "0.12"
ttf-parser = "0.25"
scraper = "0.24"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "ico"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Media_Ocr", "Graphics_Imaging", "Storage", "Storage_Streams", "Globalization", "Data_Pdf"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
